services:
  - type: web
    name: carewell-clinic-booking
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 60 app:app
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      - key: API_KEY
        sync: false
      - key: WEB_SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
